[project]
name = "rareai"
version = "0.1.0"
description = "RareAI - Explainable AI for Rare Disease Variant Prioritization (MVA Hackathon 2026)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "RareAI Team" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "cyvcf2>=0.31.1",
    "numpy>=2.0",
    "polars>=1.9",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "huggingface_hub>=0.26",
    "python-docx>=1.1.2",
    "typer>=0.12",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.8",
]

[project.scripts]
rareai = "rareai.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rareai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108", "B008"]  # B008: typer.Option defaults are the framework idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
